<h1>Lista de Personas</h1>

<table border="1" cellpadding="10">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Teléfono</th>
    </tr>
  </thead>

  <tbody>
    @for (persona of personas; track persona.id) {
    <tr>
      <td>{{ persona.id }}</td>
      <td>{{ persona.nombre }}</td>
      <td>{{ persona.telefono }}</td>
    </tr>
    }
  </tbody>
</table>
